<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">控制面板主流程</title>
  <desc id="desc">展示控制面板的扫描区、执行层和区域切换按钮，以及全局遥控速度输入的位置与用途。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fd"/>
      <stop offset="1" stop-color="#e3ecf7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#64748b" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3b82f6"/>
    </marker>
    <style>
      .title { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .body { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .tiny { font: 500 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: rgba(255,255,255,0.95); stroke: #d7e0ef; stroke-width: 2; filter: url(#shadow); }
      .btn { fill: #f8fbff; stroke: #cbd5e1; stroke-width: 1.5; }
      .blue { fill: #eaf2ff; stroke: #93c5fd; }
      .green { fill: #e7f8ef; stroke: #86efac; }
      .amber { fill: #fff5db; stroke: #fcd34d; }
      .red { fill: #fde8e8; stroke: #fca5a5; }
      .gray { fill: #edf2f7; stroke: #cbd5e1; }
      .call { fill: #ffffff; stroke: #bfdbfe; stroke-width: 2; rx: 16; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <rect x="42" y="38" width="1316" height="724" rx="28" class="panel"/>
  <text x="68" y="86" class="title">控制面板是现场主流程入口</text>
  <text x="68" y="116" class="sub">先建账本，再执行全局绑扎；如果只想试一下，也可以单点视觉测试或触发单点绑扎。</text>

  <rect x="70" y="158" width="360" height="548" rx="24" fill="#f8fbff" stroke="#dbe6f3" stroke-width="2"/>
  <text x="96" y="198" class="body">扫描区</text>
  <rect x="96" y="220" width="300" height="70" rx="20" class="blue"/>
  <text x="160" y="262" class="body">触发扫描视觉</text>
  <rect x="96" y="306" width="300" height="70" rx="20" class="btn"/>
  <text x="165" y="348" class="tiny">清除所有绑扎点</text>

  <text x="96" y="412" class="body">执行层</text>
  <rect x="96" y="434" width="142" height="70" rx="20" class="green"/>
  <text x="128" y="476" class="tiny">执行全局绑扎</text>
  <rect x="254" y="434" width="142" height="70" rx="20" class="red"/>
  <text x="283" y="468" class="tiny">触发单点</text>
  <text x="295" y="486" class="tiny">绑扎</text>
  <rect x="96" y="520" width="142" height="70" rx="20" class="blue"/>
  <text x="126" y="554" class="tiny">单点视觉</text>
  <text x="130" y="572" class="tiny">测试</text>
  <rect x="254" y="520" width="142" height="70" rx="20" class="amber"/>
  <text x="285" y="554" class="tiny">记忆续跑</text>
  <text x="292" y="572" class="tiny">开始</text>

  <text x="96" y="644" class="body">区域切换</text>
  <rect x="96" y="666" width="142" height="58" rx="18" class="blue"/>
  <text x="124" y="702" class="tiny">上一个区域</text>
  <rect x="254" y="666" width="142" height="58" rx="18" class="blue"/>
  <text x="282" y="702" class="tiny">下一个区域</text>

  <rect x="474" y="158" width="860" height="280" rx="24" fill="#ffffff" stroke="#dbe6f3" stroke-width="2"/>
  <text x="500" y="198" class="body">推荐的点击顺序</text>
  <rect x="520" y="228" width="140" height="70" rx="22" class="blue"/>
  <text x="552" y="270" class="tiny">确认工作区</text>
  <rect x="698" y="228" width="140" height="70" rx="22" class="blue"/>
  <text x="730" y="262" class="tiny">自动触发</text>
  <text x="730" y="280" class="tiny">扫描视觉</text>
  <rect x="876" y="228" width="140" height="70" rx="22" class="green"/>
  <text x="913" y="262" class="tiny">生成账本</text>
  <text x="913" y="280" class="tiny">与路径</text>
  <rect x="1054" y="228" width="140" height="70" rx="22" class="amber"/>
  <text x="1087" y="262" class="tiny">执行全局</text>
  <text x="1087" y="280" class="tiny">绑扎</text>
  <path d="M660 263 L690 263" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M838 263 L868 263" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1016 263 L1046 263" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="520" y="336" width="644" height="70" rx="18" class="btn"/>
  <text x="546" y="377" class="tiny">执行失败时先看图像面板、算法日志和当前工作区是否已确认。</text>

  <rect x="474" y="466" width="860" height="240" rx="24" fill="#f8fbff" stroke="#dbe6f3" stroke-width="2"/>
  <text x="500" y="506" class="body">全局遥控速度</text>
  <rect x="520" y="538" width="336" height="124" rx="22" class="btn"/>
  <text x="546" y="572" class="tiny">索驱全局移动速度</text>
  <rect x="546" y="592" width="252" height="22" rx="11" fill="#dbeafe"/>
  <rect x="546" y="592" width="180" height="22" rx="11" fill="#60a5fa"/>
  <text x="546" y="632" class="tiny">影响索驱遥控、识别位姿移动和人工切区。</text>
  <rect x="892" y="538" width="336" height="124" rx="22" class="btn"/>
  <text x="918" y="572" class="tiny">TCP 线模执行速度</text>
  <rect x="918" y="592" width="252" height="22" rx="11" fill="#fde68a"/>
  <rect x="918" y="592" width="144" height="22" rx="11" fill="#f59e0b"/>
  <text x="918" y="632" class="tiny">影响 TCP 线性模组遥控速度。</text>

  <rect x="438" y="82" width="292" height="42" rx="16" class="call"/>
  <text x="458" y="109" class="tiny">先建账本，再执行；单点测试和续跑都在这里。</text>
</svg>
