name: Deploy Help Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/tie_robot_web/help/**"
      - ".github/workflows/deploy-help-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-help-site
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/tie_robot_web/help/package-lock.json

      - name: Install help dependencies
        working-directory: src/tie_robot_web/help
        run: npm ci

      - name: Build help for GitHub Pages
        working-directory: src/tie_robot_web/help
        run: npm run build:github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/tie_robot_web/help/package-lock.json

      - name: Install help dependencies
        working-directory: src/tie_robot_web/help
        run: npm ci

      - name: Build help for Cloudflare Pages
        working-directory: src/tie_robot_web/help
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_BRANCH: main
        run: ./scripts/deploy_help_cloudflare_pages.sh
