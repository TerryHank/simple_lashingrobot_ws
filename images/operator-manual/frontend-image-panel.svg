<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">图像面板与话题切换</title>
  <desc id="desc">展示红外、彩色、深度、扫描识别底图、执行视觉底图以及点云话题切换和覆盖层内容。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#e5eef8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#64748b" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .body { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .tiny { font: 500 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: rgba(255,255,255,0.95); stroke: #d7e0ef; stroke-width: 2; filter: url(#shadow); }
      .chip { fill: #f8fbff; stroke: #cbd5e1; stroke-width: 1.5; }
      .blue { fill: #eaf2ff; stroke: #93c5fd; }
      .green { fill: #e7f8ef; stroke: #86efac; }
      .amber { fill: #fff5db; stroke: #fcd34d; }
      .red { fill: #fde8e8; stroke: #fca5a5; }
      .gray { fill: #edf2f7; stroke: #cbd5e1; }
      .call { fill: #ffffff; stroke: #bfdbfe; stroke-width: 2; rx: 16; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <rect x="42" y="38" width="1316" height="724" rx="28" class="panel"/>
  <text x="68" y="86" class="title">图像面板负责把相机和视觉结果放到同一个窗口里</text>
  <text x="68" y="116" class="sub">切换话题后，下面的底图会跟着变，工作区角点、扫描点、执行点和点云覆盖层也会叠上去。</text>

  <rect x="70" y="160" width="890" height="500" rx="24" fill="#f8fbff" stroke="#dbe6f3" stroke-width="2"/>
  <rect x="98" y="188" width="312" height="44" rx="18" class="chip"/>
  <text x="124" y="216" class="tiny">红外图像 / 彩色图像 / 深度图像 / 扫描识别底图 / 执行视觉底图</text>
  <rect x="702" y="188" width="220" height="44" rx="18" class="blue"/>
  <text x="732" y="216" class="tiny">话题切换下拉</text>

  <rect x="98" y="256" width="818" height="286" rx="22" fill="#08111f" stroke="#334155" stroke-width="2"/>
  <path d="M124 462 C220 412, 298 432, 370 376 S558 286, 660 360 S768 458, 882 320" stroke="#60a5fa" stroke-width="4" fill="none"/>
  <path d="M152 398 C232 350, 322 356, 390 304 S524 236, 634 276 S760 338, 850 258" stroke="#22c55e" stroke-width="4" fill="none" opacity="0.85"/>
  <circle cx="204" cy="360" r="7" fill="#f59e0b"/><circle cx="250" cy="338" r="7" fill="#f59e0b"/><circle cx="318" cy="326" r="7" fill="#f59e0b"/>
  <circle cx="412" cy="300" r="7" fill="#ef4444"/><circle cx="498" cy="258" r="7" fill="#ef4444"/><circle cx="606" cy="302" r="7" fill="#ef4444"/>
  <circle cx="744" cy="364" r="7" fill="#f59e0b"/><circle cx="812" cy="334" r="7" fill="#f59e0b"/>
  <path d="M122 430 L252 430 L296 368 L440 368 L492 312 L622 312 L668 340 L828 340" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-dasharray="5 6"/>
  <text x="126" y="514" class="tiny">图像区支持工作区角点、扫描点、执行点、分类标记和悬停坐标。</text>

  <rect x="98" y="566" width="190" height="58" rx="18" class="green"/>
  <text x="136" y="601" class="tiny">工作区角点</text>
  <rect x="304" y="566" width="190" height="58" rx="18" class="amber"/>
  <text x="340" y="601" class="tiny">扫描识别点</text>
  <rect x="510" y="566" width="190" height="58" rx="18" class="red"/>
  <text x="552" y="601" class="tiny">执行分类点</text>
  <rect x="716" y="566" width="180" height="58" rx="18" class="blue"/>
  <text x="748" y="601" class="tiny">悬停坐标</text>

  <rect x="982" y="160" width="346" height="500" rx="24" fill="#ffffff" stroke="#dbe6f3" stroke-width="2"/>
  <text x="1008" y="200" class="body">常见话题</text>
  <rect x="1006" y="226" width="298" height="42" rx="14" class="blue"/><text x="1030" y="252" class="tiny">红外图像：工作区选点和现场主视图</text>
  <rect x="1006" y="276" width="298" height="42" rx="14" class="chip"/><text x="1030" y="302" class="tiny">彩色图像：查看 RGB 画面</text>
  <rect x="1006" y="326" width="298" height="42" rx="14" class="chip"/><text x="1030" y="352" class="tiny">深度图像：排查遮挡与缺深</text>
  <rect x="1006" y="376" width="298" height="42" rx="14" class="green"/><text x="1030" y="402" class="tiny">扫描识别底图：Surface-DP 诊断图</text>
  <rect x="1006" y="426" width="298" height="42" rx="14" class="amber"/><text x="1030" y="452" class="tiny">执行视觉底图：Hough 或 Surface-DP</text>
  <rect x="1006" y="476" width="298" height="42" rx="14" class="gray"/><text x="1030" y="502" class="tiny">滤波 / 原始世界点云图</text>
  <rect x="1006" y="526" width="298" height="42" rx="14" class="red"/><text x="1030" y="552" class="tiny">BND / UNB / UNC 分类覆盖</text>

  <text x="1008" y="604" class="tiny">看点图时，先确认你切的是哪种底图，再看覆盖层。</text>
  <text x="1008" y="626" class="tiny">调试时可以切换 `map`、`gripper_frame` 或 `Scepter_depth_frame`。</text>

  <rect x="70" y="684" width="1258" height="48" rx="16" class="call"/>
  <text x="94" y="714" class="tiny">红外图像是最常用的工作区入口；扫描识别底图和执行视觉底图只在算法调试时重点看。</text>
</svg>
